# DiscreteRTC/dRTC piper_demos/classify_blocks (alias: classification_cube,
# cubes_classification), raw 30-step per-step delta joint targets (see below).
# Default backbone from 2026-10-16: Qwen3-VL-2B-Instruct-Action (StarVLA; 28 layers,
# hidden 2048 -> LayerwiseFM depth/projectors follow automatically).  Otherwise identical to
# the Qwen3-VL-4B run starvla_qwenpi_piper_demos_classify_blocks_30hz_raw_h30_2gpu_gb32_30k.yaml.
# Recipe: stacking_cups_action_30hz 2-GPU base recipe (Qwen3-VL-4B-Instruct,
# frozen qwen_vl_interface, LayerwiseFM, global batch 16 x 2 GPUs x accum 1 = 32)
# with a 10k-step schedule (cosine to min_lr over 10k; 2B measured 0.62-0.69 s/step on a quiet node).  Budget: trainer.max_wall_time_hours (graceful stop).
# PER-STEP DELTA JOINT ANGLES (BSplineEncoder preset ``state-delta-joint``, dataset
# data/processed/piper_demos/StateDeltaJoint/classify_blocks_30hz_cleanup):
#   action[t] = measured joints q[t+1] - q[t] (6, rad) + absolute measured gripper[t+1];
#   chunk k predicts q[t+k+1] - q[t+k]; joint targets = q[t] + cumsum over the chunk.
# The deltas are stored in the dataset itself, so action_mode stays ``abs`` (no loader transform).
# Delta variant of starvla_qwenpi_qwen3vl2b_piper_demos_classify_blocks_30hz_raw_h30_2gpu_gb32_30k.yaml
# (only run_id, data_mix, the action_type label, max_train_steps 10000 and save_interval 2500 differ).
# Launch: run_qwenpi_qwen3vl2b_piper_demos_classify_blocks_30hz_delta_joint_raw_h30_2gpu_gb32_10k.sh
run_id: piper_demos_classify_blocks_30hz_qwenpi_qwen3vl2b_delta_joint_raw_h30_2gpu_gb32_10k
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: 401910710-university-of-california-berkeley
wandb_project: starVLA_piper
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-2B-Instruct-Action
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    state_dim: 7
    action_horizon: 30
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ./data
    data_mix: piper_demos_classify_blocks_30hz_delta_joint_raw_h30
    include_state: true
    # Train-split episodes only (info.json splits); stats -> meta/stats_gr00t_train.json
    episode_split: train
    action_type: delta_qpos  # label only; the dataset stores per-step deltas
    action_mode: abs  # deltas are precomputed in the dataset; do NOT add a starVLA delta/rel transform
    sequential_step_sampling: false
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av
    # 2 workers starve the GPUs on these long episodes (0.3-1.2 s data wait/step);
    # 8 per rank measured 0 s data wait, 0.81 s/step (2026-10-15 smoke test).
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: true

trainer:
  pretrained_checkpoint: null
  freeze_modules: qwen_vl_interface
  max_train_steps: 10000
  num_warmup_steps: 500
  save_interval: 2500
  eval_interval: 1000
  repeated_diffusion_steps: 2
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-06
    action_model: 1.0e-04
    project_layers: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
  is_resume: false
  # Budget controls (starVLA/training/trainer_utils/run_budget.py)
  max_wall_time_hours: 10.0
  wall_time_safety_minutes: 20.0
  save_training_state: true
