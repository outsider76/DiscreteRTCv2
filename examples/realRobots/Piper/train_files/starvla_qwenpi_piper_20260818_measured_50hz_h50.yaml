run_id: piper_pick_white_block_20260818_qwenpi_measured_50hz_h50
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_piper
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    state_dim: 7
    # 50 samples at 50 Hz: one second of measured Piper motion.
    action_horizon: 50
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ./data/piper_lerobot
    data_mix: piper_pick_white_block_20260818_measured_50hz_h50
    include_state: true
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av
    num_workers: 2
    pin_memory: true

trainer:
  # Only reuse the Qwen backbone. Do not reuse either the OFT MLP head or the
  # previous Flow head trained on GELLO command targets.
  pretrained_checkpoint: ./results/Checkpoints/piper_pick_white_block_qwenoft_46ep_v2/checkpoints/steps_10000_pytorch_model.pt
  reload_modules: qwen_vl_interface
  freeze_modules: qwen_vl_interface

  max_train_steps: 10000
  num_warmup_steps: 500
  save_interval: 2000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-06
    action_model: 1.0e-04
    project_layers: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
  is_resume: false
