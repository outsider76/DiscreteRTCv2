# DiscreteRTC/dRTC piper_demos/classify_blocks (alias: classification_cube,
# cubes_classification), uniform-left cubic B-spline targets (18 controls -> 30 steps, span 2).
# Recipe: stacking_cups_action_30hz 2-GPU base recipe (Qwen3-VL-4B-Instruct,
# frozen qwen_vl_interface, LayerwiseFM, global batch 16 x 2 GPUs x accum 1 = 32)
# with the 30k-step cubes_classification schedule; fits 2 GPUs x 10 h at the
# measured 0.81 s/step (~7 h for 30k steps).  Budget: trainer.max_wall_time_hours (graceful stop).
# Launch: run_qwenpi_piper_demos_classify_blocks_30hz_uniform_left_s2_h30_c18_2gpu_gb32_30k.sh
run_id: piper_demos_classify_blocks_30hz_qwenpi_uniform_left_s2_h30_c18_2gpu_gb32_30k
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: 401910710-university-of-california-berkeley
wandb_project: starVLA_piper
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3_UniformBSpline
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    state_dim: 7
    action_horizon: 18
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64
  action_representation:
    type: continuous_uniform_bspline
    mode: uniform_left
    action_dim: 7
    frequency_hz: 30.0
    executable_horizon: 30
    num_control_points: 18
    degree: 3
    span_length_steps: 2
    regularization: 1.0e-4
    end_padding: true
    implementation_version: uniform_left_direct_fit_v1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ./data
    data_mix: piper_demos_classify_blocks_30hz_uniform_left_bspline
    controls_dataset_path: ./data/processed/piper_demos/ActionCommand/State_Joint/classify_blocks_30hz_cleanup_spline_uniform_left_s2_h30_c18
    include_state: true
    # Train-split episodes only (info.json splits); stats -> meta/stats_gr00t_train.json
    episode_split: train
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av
    # 2 workers starve the GPUs on these long episodes (0.3-1.2 s data wait/step);
    # 8 per rank measured 0 s data wait, 0.81 s/step (2026-10-15 smoke test).
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: true

trainer:
  pretrained_checkpoint: null
  freeze_modules: qwen_vl_interface
  max_train_steps: 30000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 1000
  repeated_diffusion_steps: 2
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-06
    action_model: 1.0e-04
    project_layers: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
  is_resume: false
  # Budget controls (starVLA/training/trainer_utils/run_budget.py)
  max_wall_time_hours: 10.0
  wall_time_safety_minutes: 20.0
  save_training_state: true
